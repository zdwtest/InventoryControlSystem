<!DOCTYPE html>
<html>
<head>
    <title>材料领用</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
{% include 'header.html' %}
    <div class="container">
        <h2>材料领用</h2>
        {% if material %}
            <form method="POST">
                <div class="form-group">
                    <label for="materialName">材料名称:</label>
                    <input type="text" class="form-control" id="materialName" value="{{ material.mc }}" readonly>
                </div>
                <div class="form-group">
                    <label for="quantity">领用数量:</label>
                    <input type="number" class="form-control" id="quantity" name="quantity" min="1" required>
                </div>
                <div class="form-group">
                    <label for="availableQuantity">可用库存:</label>
                    <input type="text" class="form-control" id="availableQuantity" value="{{ material.kcs }}" readonly>
                </div>
                <button type="submit" class="btn btn-primary">提交</button>
            </form>
        {% else %}
            <p>材料不存在</p>
        {% endif %}
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <ul class=flashes>
            {% for category, message in messages %}
              <li class="{{ category }}">{{ message }}</li>
            {% endfor %}
            </ul>
          {% endif %}
        {% endwith %}
    </div>
</body>
</html>
