<!DOCTYPE html>
<html>
<head>
    <title>已有材料入库</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
{% include 'header.html' %}
    <div class="container">
        <h1>已有材料入库</h1>
        {% if material %}
            <form method="POST">
                <div class="form-group">
                    <label for="materialName">材料名称:</label>
                    <input type="text" class="form-control" id="materialName" value="{{ material.mc }}" readonly>
                </div>
                <div class="form-group">
                    <label for="quantity">入库数量:</label>
                    <input type="number" class="form-control" id="quantity" name="quantity" min="1" required>
                </div>
                <div class="form-group">
                    <label for="unitPrice">单价:</label>
                    <input type="number" step="0.01" class="form-control" id="unitPrice" name="unit_price" required>
                </div>
                <button type="submit" class="btn btn-primary">提交</button>
            </form>
        {% else %}
            <p>材料不存在</p>
        {% endif %}
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <ul class=flashes>
            {% for category, message in messages %}
              <li class="{{ category }}">{{ message }}</li>
            {% endfor %}
            </ul>
          {% endif %}
        {% endwith %}
    </div>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
