<!DOCTYPE html>
<html>
<head>
    <title>材料入库</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
{% include 'header.html' %}
    <div class="container">
        <h1>材料入库</h1>
        <form method="POST">
            <div class="form-group">
                <label for="category">类别:</label>
                <select class="form-control" id="category" name="category">
                    {% for category in categories %}
                        <option value="{{ category.id }}">{{ category.category_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="materialName">材料名称:</label>
                <input type="text" class="form-control" id="materialName" name="mc" required>
            </div>
            <div class="form-group">
                <label for="ggxh">规格型号:</label>
                <input type="text" class="form-control" id="ggxh" name="ggxh">
            </div>
            <div class="form-group">
                <label for="hh">货号:</label>
                <input type="text" class="form-control" id="hh" name="hh" required>
            </div>
            <div class="form-group">
                <label for="dw">单位:</label>
                <input type="text" class="form-control" id="dw" name="dw">
            </div>
            <div class="form-group">
                <label for="quantity">入库数量:</label>
                <input type="number" class="form-control" id="quantity" name="quantity" min="1" required>
            </div>
            <div class="form-group">
                <label for="unitPrice">单价:</label>
                <input type="number" step="0.01" class="form-control" id="unitPrice" name="unit_price" required>
            </div>
            <button type="submit" class="btn btn-primary">提交</button>
        </form>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <ul class=flashes>
            {% for category, message in messages %}
              <li class="{{ category }}">{{ message }}</li>
            {% endfor %}
            </ul>
          {% endif %}
        {% endwith %}
    </div>
</body>
</html>
